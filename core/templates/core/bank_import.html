{% extends 'core/base.html' %}{% block content %}<h1>Import statement evidence</h1><p class="muted">UTF-8 CSV headers: external_id,date,amount,memo. Signed amounts: incoming positive, outgoing negative. Stable bank IDs deduplicate repeated imports. Up to 5,000 rows / 2 MB.</p><section class="panel form-panel"><form method="post" enctype="multipart/form-data">{% csrf_token %}<label for="account_reference">Division bank allocation reference</label><input id="account_reference" name="account_reference" maxlength="100" required><label for="file">Statement CSV</label><input id="file" type="file" name="file" accept=".csv,text/csv" required><div class="form-actions"><button>Import & deduplicate</button></div></form></section>{% endblock %}
