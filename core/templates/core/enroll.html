{% extends 'core/base.html' %}{% block content %}<div class="auth-box"><h1>Accept your invitation</h1><p>{{ invitation.division.name }} · {{ invitation.slot|title }}</p>{% if error %}<div class="notice error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<label>Email</label><input value="{{ invitation.email }}" disabled><label for="name">Your name</label><input id="name" name="name" required><label for="password">Create a unique password</label><input id="password" type="password" name="password" minlength="12" autocomplete="new-password" required><small>At least 12 characters. You will enroll an authenticator next.</small><button>Accept invitation</button></form></div>{% endblock %}
