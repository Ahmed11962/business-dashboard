{% extends 'core/base.html' %}{% block content %}<div class="heading"><div><div class="eyebrow">Sales</div><h1>Issue internal sales document</h1><p>Add one or more products. Suggested prices are editable. Goods stay in stock until dispatch.</p></div></div><section class="panel form-panel"><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_p }}<h2>Products</h2><div id="invoice-lines"><div class="invoice-line"><label>Product<select name="product" class="product-choice" required><option value="">Choose product</option>{% for p in products %}<option value="{{ p.id }}" data-price="{{ p.default_price }}">{{ p.name }} · {{ p.sku }} · available {{ p.quantity }}</option>{% endfor %}</select></label><label>Quantity<input name="quantity" type="number" min="1" required></label><label>Price per unit · SAR<input name="unit_price" type="number" min="0" step="0.01" required></label></div></div><button type="button" class="button secondary" id="add-line">+ Add another product</button><label>Supporting documents</label><input type="file" name="files" accept="image/jpeg,image/png,application/pdf" multiple><div class="form-actions"><button>Issue document</button></div></form></section><script>document.getElementById('add-line').onclick=function(){let row=document.querySelector('.invoice-line').cloneNode(true);row.querySelectorAll('input').forEach(x=>x.value='');row.querySelector('select').value='';document.getElementById('invoice-lines').appendChild(row)};document.getElementById('invoice-lines').onchange=function(e){if(e.target.classList.contains('product-choice')){let row=e.target.closest('.invoice-line');row.querySelector('[name="unit_price"]').value=e.target.selectedOptions[0].dataset.price||''}}</script>{% endblock %}
