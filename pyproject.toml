[project]
name = "plastics-business"
version = "0.1.0"
description = "Plastics division management workspace with unanimous approvals"
requires-python = ">=3.12"
dependencies = [
    "Django==5.2.18",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
    "whitenoise>=6.9,<7",
    "pyotp>=2.9,<3",
    "reportlab>=4.4,<5",
    "openpyxl>=3.1,<4",
]
[dependency-groups]
dev = ["pgserver==0.1.4", "pytest>=8,<10", "pytest-django>=4.11,<5", "playwright>=1.55,<2"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
